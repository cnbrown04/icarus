[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
# Internal crates
icarus-api = { path = "crates/icarus-api" }
icarus-core = { path = "crates/icarus-core" }
icarus-db = { path = "crates/icarus-db" }
icarus-jobs = { path = "crates/icarus-jobs" }
icarus-push = { path = "crates/icarus-push" }

# External crates (pinned to the versions verified on crates.io, 2026-10-08)
a2 = "0.10.0"
aes-gcm = "0.11.1"
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = "0.8.9"
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
futures-util = "0.3.34"
getrandom = "0.3"
hmac = "0.12.1"
http-body-util = "0.1.5"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
subtle = "2.6.1"
sqlx = { version = "0.8.6", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "migrate",
    "uuid",
    "chrono",
    "json",
] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = [
    "trace",
    "request-id",
    "timeout",
    "compression-gzip",
    "decompression-gzip",
    "fs",
] }
uuid = { version = "1.27.0", features = ["v7", "serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
