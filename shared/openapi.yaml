          - number
          - 'null'
          format: double
        max:
          type:
          - integer
          - 'null'
          format: int32
        min:
          type:
          - integer
          - 'null'
          format: int32
        t:
          type: string
          format: date-time
    HrResponse:
      type: object
      description: Heart-rate points. `t` is the start of each bucket.
      required:
      - res
      - points
      properties:
        points:
          type: array
          items:
            $ref: '#/components/schemas/HrPoint'
        res:
          type: string
    IngressBody:
      type: object
      properties:
        channels:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Channel'
        idempotency_key:
          type:
          - string
          - 'null'
        message:
          type:
          - string
          - 'null'
        rhythm:
          oneOf:
          - $ref: '#/components/schemas/Rhythm'
          - type: 'null'
      additionalProperties: false
    Inserted:
      type: object
      required:
      - inserted
      - duplicate
      properties:
        duplicate:
          type: integer
          format: int64
          minimum: 0
        inserted:
          type: integer
          format: int64
          minimum: 0
    LiveResponse:
      type: object
      description: The latest raw sample, or both fields null when there is none.
      properties:
        bpm:
          type:
          - integer
          - 'null'
          format: int32
        ts:
          type:
          - string
          - 'null'
    LoginBody:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
        password:
          type: string
    Me:
      type: object
