        dispatch_id:
          type: string
          format: uuid
    DispatchList:
      type: object
      required:
      - dispatches
      properties:
        dispatches:
          type: array
          items:
            $ref: '#/components/schemas/Dispatch'
    DispatchStatus:
      type: string
      enum:
      - pending
      - sent
      - acked
      - unacked
      - failed
    DuplicateDispatch:
      type: object
      description: 'A repeated idempotency key: the original dispatch, with `duplicate` set.'
      required:
      - duplicate
      - dispatch_id
      properties:
        dispatch_id:
          type: string
          format: uuid
        duplicate:
          type: boolean
    EventIn:
      type: object
      required:
      - band_id
      - ts_ms
      - kind
      properties:
        band_id:
          type: string
          format: uuid
        kind:
          type: string
        payload: {}
        ts_ms:
          type: integer
          format: int64
    FormulaSex:
      type: string
      enum:
      - male
      - female
    Hook:
