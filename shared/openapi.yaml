      - confirm
      properties:
        confirm:
          type: string
    DeliveriesPage:
      type: object
      required:
      - deliveries
      properties:
        deliveries:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryView'
        next_cursor:
          type:
          - string
          - 'null'
    DeliveryIn:
      type: object
      required:
      - id
      - ts_ms
      - channel
      - status
      properties:
        alarm_id:
          type:
          - string
          - 'null'
          format: uuid
        channel:
          type: string
        detail:
          type:
          - string
          - 'null'
        dispatch_id:
          type:
          - string
          - 'null'
          format: uuid
        id:
          type: string
          format: uuid
        status:
          type: string
        ts_ms:
          type: integer
          format: int64
    DeliveryView:
      type: object
      description: |-
        One webhook request as the web page shows it. `status` is `accepted`, `rejected`,
        `rate_limited` or `duplicate`. Raw bodies are never stored.
      required:
      - id
      - received_at
      - status
      - signature_valid
      properties:
        dispatch:
          oneOf:
          - $ref: '#/components/schemas/Dispatch'
          - type: 'null'
        id:
          type: string
          format: uuid
        received_at:
          type: string
        signature_valid:
          type: boolean
        status:
          type: string
    Device:
      type: object
      required:
      - id
      - name
      - created_at
      properties:
        app_version:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        last_seen_at:
          type:
          - string
          - 'null'
          format: date-time
        model:
          type:
          - string
          - 'null'
        name:
          type: string
        os_version:
          type:
          - string
          - 'null'
        revoked_at:
          type:
          - string
          - 'null'
          format: date-time
