      required:
      - id
      - email
      - tz
      - version
      properties:
        birth_year:
          type:
          - integer
          - 'null'
          format: int32
        email:
          type: string
        formula_sex:
          oneOf:
          - $ref: '#/components/schemas/FormulaSex'
          - type: 'null'
        height_cm:
          type:
          - number
          - 'null'
          format: float
        hr_max:
          type:
          - integer
          - 'null'
          format: int32
        id:
          type: string
          format: uuid
        tz:
          type: string
        version:
          type: integer
          format: int64
        weight_kg:
          type:
          - number
          - 'null'
          format: float
    MePatch:
      type: object
      properties:
        birth_year:
          type:
          - integer
          - 'null'
          format: int32
        formula_sex:
          oneOf:
          - $ref: '#/components/schemas/FormulaSex'
          - type: 'null'
        height_cm:
          type:
          - number
          - 'null'
          format: float
        hr_max:
          type:
          - integer
          - 'null'
          format: int32
        tz:
          type:
          - string
          - 'null'
        weight_kg:
          type:
          - number
          - 'null'
          format: float
    MinuteIn:
      type: object
      required:
      - minute_ms
      - algo_version
      - sync_rev
      properties:
        active_kcal:
          type:
          - number
          - 'null'
          format: double
        algo_version:
          type: integer
          format: int64
        baevsky_sqrt:
          type:
          - number
          - 'null'
          format: double
        hr_avg:
          type:
          - number
          - 'null'
          format: double
        hr_max:
          type:
          - integer
          - 'null'
          format: int64
        hr_min:
          type:
          - integer
          - 'null'
          format: int64
        hr_n:
          type:
          - integer
          - 'null'
          format: int64
        kcal:
          type:
          - number
          - 'null'
          format: double
        kcal_estimated:
          type:
          - boolean
          - 'null'
        minute_ms:
          type: integer
          format: int64
        rmssd_ms:
          type:
          - number
          - 'null'
          format: double
        sdnn_ms:
          type:
          - number
          - 'null'
          format: double
        stress:
          type:
          - integer
          - 'null'
          format: int64
        stress_state:
          type:
          - string
          - 'null'
        sync_rev:
          type: integer
          format: int64
    MinuteOut:
      type: object
      required:
      - minute
      properties:
        active_kcal:
          type:
          - number
          - 'null'
          format: float
        baevsky_sqrt:
          type:
          - number
          - 'null'
          format: float
        hr_avg:
          type:
          - number
          - 'null'
          format: float
        hr_max:
          type:
          - integer
          - 'null'
          format: int32
        hr_min:
          type:
          - integer
          - 'null'
          format: int32
        hr_n:
          type:
          - integer
          - 'null'
          format: int32
        kcal:
          type:
          - number
          - 'null'
          format: float
        kcal_estimated:
          type:
          - boolean
          - 'null'
        minute:
          type: string
          format: date-time
        rmssd_ms:
          type:
          - number
          - 'null'
          format: float
        sdnn_ms:
          type:
          - number
          - 'null'
          format: float
        stress:
          type:
          - integer
          - 'null'
          format: int32
        stress_state:
          type:
          - string
          - 'null'
    MinutesResponse:
      type: object
      description: 'Typed responses: going through `json!` would widen `f32` values and show their binary noise.'
      required:
      - minutes
      properties:
        minutes:
          type: array
          items:
            $ref: '#/components/schemas/MinuteOut'
    NamedRhythm:
      type: string
      description: Built-in rhythm names. PLAN.md §9.2.
      enum:
      - single
      - double
      - triple
      - long
      - ramp
      - sos
    PairBody:
      type: object
      required:
      - code
      - name
      properties:
        app_version:
          type:
          - string
          - 'null'
        code:
          type: string
        model:
          type:
          - string
          - 'null'
        name:
          type: string
        os_version:
          type:
          - string
          - 'null'
    PairResponse:
      type: object
      required:
      - device_id
      - token
      properties:
        device_id:
          type: string
          format: uuid
        token:
          type: string
    PairingCodeResponse:
      type: object
      required:
      - code
      - qr_svg
      - expires_at
      properties:
        code:
          type: string
        expires_at:
          type: string
          format: date-time
        qr_svg:
          type: string
    Problem:
      type: object
      description: RFC 9457 problem document. Handlers build it in `error.rs`; this type only documents it.
      required:
      - type
      - title
      - status
      - detail
      properties:
        current:
          type:
          - object
          - 'null'
          description: The stored entity, on `conflict` responses only.
        detail:
          type: string
        status:
          type: integer
          format: int32
          minimum: 0
        title:
          type: string
        type:
          type: string
          description: '`urn:icarus:problem:<slug>`, where the slug is one of the contract''s list.'
    PushTokenBody:
      type: object
      required:
      - apns_token
      - environment
      properties:
        apns_token:
          type: string
        environment:
          type: string
    Rhythm:
      oneOf:
      - $ref: '#/components/schemas/NamedRhythm'
      - type: array
        items:
          $ref: '#/components/schemas/Step'
      description: A built-in name, or an explicit list of steps.
    RrIn:
      type: object
      required:
      - band_id
      - ts_ms
      - seq
      - rr_ms
      - accepted
      properties:
        accepted:
          type: array
          items:
            type: boolean
        band_id:
          type: string
          format: uuid
        rr_ms:
          type: array
          items:
            type: number
            format: double
        seq:
          type: array
          items:
            type: integer
            format: int64
        ts_ms:
          type: array
          items:
            type: integer
            format: int64
    Schedule:
      type: object
      description: Scheduled alarms only. `weekdays` uses ISO numbering (1 = Monday). Empty means the next occurrence.
      required:
      - time
      - weekdays
      properties:
        time:
          type: string
        weekdays:
          type: array
          items:
            type: integer
            format: int32
            minimum: 0
    SecretResponse:
      type: object
      required:
      - secret
      properties:
        secret:
          type: string
    StateResponse:
      type: object
      required:
      - server_time
      - batches
      properties:
        batches:
          type: array
          items:
            $ref: '#/components/schemas/BatchSummary'
        last_batch_at:
          type:
          - string
          - 'null'
        server_time:
          type: string
          format: date-time
    StatusBody:
      type: object
      required:
      - connected
      - scopes
      properties:
        connected:
          type: boolean
        connected_at:
          type:
          - string
          - 'null'
        last_webhook_at:
          type:
          - string
          - 'null'
        scopes:
          type: array
          items:
            type: string
    StatusResponse:
      type: object
      required:
      - status
      properties:
        status:
          type: string
    Step:
      oneOf:
      - type: object
        required:
        - preset
        - loops
        - type
        properties:
          loops:
            type: integer
            format: int32
            minimum: 0
          preset:
            type: integer
            format: int32
            minimum: 0
          type:
            type: string
            enum:
            - buzz
      - type: object
        required:
        - ms
        - type
        properties:
          ms:
            type: integer
            format: int32
            minimum: 0
          type:
            type: string
            enum:
            - pause
      description: One rhythm step. A buzz loop counts as 1 s toward the 30 s limit.
    Summary:
      type: object
      description: The day's values as the API contract shows them. Any may be null.
      properties:
        hrv_rmssd_milli:
          type:
          - number
          - 'null'
          format: double
        kilojoule:
          type:
          - number
          - 'null'
          format: double
        recovery_score:
          type:
          - number
          - 'null'
          format: double
        resting_heart_rate:
          type:
          - number
          - 'null'
          format: double
        sleep_performance:
          type:
          - number
          - 'null'
          format: double
        strain:
          type:
          - number
          - 'null'
          format: double
    Upserted:
      type: object
      required:
      - upserted
      - stale
      properties:
        stale:
          type: integer
          format: int64
          minimum: 0
        upserted:
          type: integer
          format: int64
          minimum: 0
  securitySchemes:
    device:
      type: http
      scheme: bearer
    session:
      type: apiKey
      in: cookie
      name: icarus_session
      description: 'Website session from POST /v1/auth/login. Non-GET requests also send X-Icarus-CSRF: 1.'
tags:
- name: Health
- name: Auth
  description: 'Website sign-in. No sign-up route: the single user is created with the create-user command.'
- name: Me
- name: Devices
- name: Sync
  description: Upload from the app, config download and state.
- name: Metrics
- name: Alarms
- name: Webhooks
  description: Hook management (website only).
- name: Webhook ingress
  description: Public. Authenticated by signature or secret URL, not by session or device token.
- name: Data
- name: WHOOP
  description: Optional. Every route answers 404 unless WHOOP_CLIENT_ID and WHOOP_CLIENT_SECRET are set.
