        events:
          $ref: '#/components/schemas/Inserted'
        hr:
          $ref: '#/components/schemas/Inserted'
        minute_metrics:
          $ref: '#/components/schemas/Upserted'
        rr:
          $ref: '#/components/schemas/Inserted'
    DailyResponse:
      type: object
