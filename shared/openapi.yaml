    HookList:
      type: object
      required:
      - hooks
      properties:
        hooks:
          type: array
          items:
            $ref: '#/components/schemas/Hook'
    HookPatch:
      type: object
      properties:
        alarm_id:
          type:
          - string
          - 'null'
          format: uuid
        enabled:
          type:
          - boolean
          - 'null'
        label:
          type:
          - string
          - 'null'
        rate_limit_per_min:
          type:
          - integer
          - 'null'
          format: int32
