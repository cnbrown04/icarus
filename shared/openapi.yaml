openapi: 3.1.0
info:
  title: Icarus API
  description: Contract v1 for the Icarus server (shared/api-contract.md). Times are RFC 3339 UTC with Z, except fields ending in _ms (epoch milliseconds). Metrics are estimates, not medical readings.
  version: 1.0.0
paths:
  /healthz:
    get:
      tags:
      - Health
      summary: Liveness. Does not touch the database.
      operationId: healthz
      responses:
        '200':
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
  /readyz:
    get:
      tags:
      - Health
      summary: 'Readiness: the database answers and every embedded migration is applied.'
      operationId: readyz
      responses:
        '200':
          description: Ready to serve.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        default:
          description: Not ready.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/alarm-dispatches:
    get:
      tags:
      - Alarms
      operationId: list_alarm_dispatches
      parameters:
      - name: limit
        in: query
        description: 1 to 200. Default 50.
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchList'
        default:
          description: An error as application/problem+json (api-contract.md Errors).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - session: []
      - device: []
  /v1/alarm-dispatches/{id}/ack:
    post:
      tags:
      - Alarms
      summary: |-
        The app reports what the phone and band did. The first ack sets `acked_at`; later acks replace
        the statuses.
      operationId: ack_alarm_dispatch
      parameters:
      - name: id
        in: path
        description: Id of the resource.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AckBody'
        required: true
      responses:
        '204':
          description: Recorded. The first ack sets acked_at.
        default:
          description: An error as application/problem+json (api-contract.md Errors).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - device: []
  /v1/alarms:
    get:
      tags:
      - Alarms
      operationId: list_alarms
      responses:
        '200':
          description: Alarms that are not deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlarmList'
        default:
          description: An error as application/problem+json (api-contract.md Errors).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - session: []
      - device: []
    post:
      tags:
      - Alarms
      operationId: create_alarm
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlarmCreate'
        required: true
      responses:
        '201':
          description: The created alarm.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alarm'
        default:
          description: An error as application/problem+json (api-contract.md Errors).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - session: []
      - device: []
  /v1/alarms/pending:
    get:
      tags:
      - Alarms
      summary: Unacked dispatches from the last 10 minutes, for the app's pull (PLAN.md §9.3).
      operationId: pending_alarm_dispatches
      responses:
        '200':
          description: Unacked dispatches from the last 10 minutes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchList'
        default:
          description: An error as application/problem+json (api-contract.md Errors).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - device: []
  /v1/alarms/{id}:
    delete:
      tags:
      - Alarms
      summary: 'Soft delete: the row stays as a tombstone with a new version, so the app learns of the deletion.'
      operationId: delete_alarm
      parameters:
      - name: id
        in: path
        description: Id of the resource.
        required: true
        schema:
          type: string
          format: uuid
      - name: If-Match
        in: header
        description: Optional. When sent, a stale value gets 409.
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      responses:
        '204':
          description: Soft-deleted. The version is bumped so the app sees a tombstone.
        default:
          description: An error as application/problem+json (api-contract.md Errors).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - session: []
      - device: []
    patch:
      tags:
      - Alarms
      operationId: patch_alarm
      parameters:
      - name: id
        in: path
        description: Id of the resource.
        required: true
        schema:
          type: string
          format: uuid
      - name: If-Match
        in: header
        description: Current version. Required; a stale value gets 409.
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlarmPatch'
        required: true
      responses:
        '200':
          description: The updated alarm.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alarm'
        default:
          description: An error as application/problem+json (api-contract.md Errors).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - session: []
      - device: []
  /v1/alarms/{id}/test:
    post:
      tags:
      - Alarms
      summary: |-
        Queues a test dispatch with the alarm's own rhythm and channels. The app and dispatcher treat it
        like a webhook dispatch.
      operationId: test_alarm
      parameters:
      - name: id
        in: path
        description: Id of the resource.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '202':
          description: Queued with the alarm rhythm and channels.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchIdResponse'
        default:
          description: An error as application/problem+json (api-contract.md Errors).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - session: []
      - device: []
  /v1/auth/login:
    post:
      tags:
      - Auth
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginBody'
        required: true
      responses:
        '204':
          description: Signed in. Sets the icarus_session cookie (HttpOnly, SameSite=Lax, Secure unless ICARUS_INSECURE_COOKIES=1).
        '401':
          description: Bad credentials.
        default:
          description: An error as application/problem+json (api-contract.md Errors).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/auth/logout:
    post:
      tags:
      - Auth
      operationId: logout
      responses:
        '204':
          description: Signed out. Clears the session cookie.
        default:
          description: An error as application/problem+json (api-contract.md Errors).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/devices:
    get:
      tags:
      - Devices
      operationId: list_devices
      responses:
        '200':
          description: Devices and bands of the account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceList'
        default:
          description: An error as application/problem+json (api-contract.md Errors).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - session: []
      - device: []
  /v1/devices/me/push-token:
    put:
      tags:
      - Devices
      operationId: put_push_token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushTokenBody'
        required: true
      responses:
        '204':
          description: Stored for this device.
        default:
          description: An error as application/problem+json (api-contract.md Errors).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - device: []
  /v1/devices/pair:
    post:
      tags:
      - Devices
      summary: Exchanges a single-use pairing code for a device token. The token is returned once.
      operationId: pair_device
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairBody'
        required: true
      responses:
        '201':
          description: Paired. The token is shown once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairResponse'
        default:
          description: An error as application/problem+json (api-contract.md Errors).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/devices/pairing-codes:
    post:
      tags:
      - Devices
      operationId: create_pairing_code
      responses:
        '200':
          description: A single-use code, valid for 10 minutes, and its QR code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingCodeResponse'
        default:
          description: An error as application/problem+json (api-contract.md Errors).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - session: []
  /v1/devices/{id}:
    delete:
      tags:
      - Devices
      summary: Revokes a device. Its token gets 401 from the next request on.
      operationId: revoke_device
      parameters:
      - name: id
        in: path
        description: Id of the resource.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Device revoked. Its token gets 401 from now on.
        default:
          description: An error as application/problem+json (api-contract.md Errors).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - session: []
  /v1/export:
    get:
      tags:
      - Data
      operationId: export_data
      responses:
        '200':
          description: One JSON object per line, each with a kind field.
          content:
            application/x-ndjson:
              schema:
                type: string
        default:
          description: An error as application/problem+json (api-contract.md Errors).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - session: []
  /v1/hooks:
    get:
      tags:
      - Webhooks
      operationId: list_hooks
      responses:
        '200':
          description: Hooks, without secrets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HookList'
        default:
          description: An error as application/problem+json (api-contract.md Errors).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - session: []
    post:
      tags:
      - Webhooks
      operationId: create_hook
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HookCreate'
        required: true
      responses:
        '201':
          description: The hook. The secret is in this response only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HookCreated'
        default:
          description: An error as application/problem+json (api-contract.md Errors).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - session: []
  /v1/hooks/{id}:
    post:
      tags:
      - Webhook ingress
      summary: '`POST /v1/hooks/{key}`: HMAC-signed, for endpoints in `hmac` mode.'
      operationId: post_hook_ingress
      parameters:
      - name: id
        in: path
        description: Hook id for management routes. For ingress, the endpoint slug.
        required: true
        schema:
          type: string
      - name: X-Icarus-Signature
        in: header
        description: t=<unix>,v1=<hex HMAC-SHA256(secret, t + "." + body)>. Timestamp within 300 s.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngressBody'
        required: true
      responses:
        '200':
          description: Repeated idempotency_key. The original dispatch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicateDispatch'
        '202':
          description: Queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchIdResponse'
        '408':
          description: Did not finish within 2 s. Empty body.
        '429':
          description: Over the per-IP budget (60 per minute) or the endpoint budget. No delivery row is written for the per-IP case.
        default:
          description: An error as application/problem+json (api-contract.md Errors).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      tags:
      - Webhooks
      summary: |-
        Hard delete. Deliveries and their dispatches go with it. The sync config has no tombstone for
        hooks (api-contract.md `Hook` has no `deleted_at`), so the app learns of it on its next full read.
      operationId: delete_hook
      parameters:
      - name: id
        in: path
        description: Id of the resource.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Hard-deleted with its deliveries.
        default:
          description: An error as application/problem+json (api-contract.md Errors).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - session: []
    patch:
      tags:
      - Webhooks
      operationId: patch_hook
      parameters:
      - name: id
        in: path
        description: Id of the resource.
        required: true
        schema:
          type: string
          format: uuid
      - name: If-Match
        in: header
        description: Current version. Required; a stale value gets 409.
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HookPatch'
        required: true
      responses:
        '200':
          description: The updated hook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hook'
        default:
          description: An error as application/problem+json (api-contract.md Errors).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - session: []
  /v1/hooks/{id}/deliveries:
    get:
      tags:
      - Webhooks
      operationId: list_hook_deliveries
      parameters:
      - name: id
        in: path
        description: Id of the resource.
        required: true
        schema:
          type: string
          format: uuid
      - name: cursor
        in: query
        description: Opaque cursor from next_cursor.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: 50 per page, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveriesPage'
        default:
          description: An error as application/problem+json (api-contract.md Errors).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - session: []
  /v1/hooks/{id}/rotate-secret:
    post:
      tags:
      - Webhooks
      operationId: rotate_hook_secret
      parameters:
      - name: id
        in: path
        description: Id of the resource.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The new secret. Shown once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretResponse'
        default:
          description: An error as application/problem+json (api-contract.md Errors).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - session: []
  /v1/hooks/{id}/{secret}:
    post:
      tags:
      - Webhook ingress
      summary: '`POST /v1/hooks/{key}/{secret}`: secret-URL mode, for endpoints that opted in.'
      operationId: post_hook_ingress_secret
      parameters:
      - name: id
        in: path
        description: Endpoint slug.
        required: true
        schema:
          type: string
      - name: secret
        in: path
        description: The secret from the hook, for secret_url endpoints only.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngressBody'
        required: true
      responses:
        '200':
          description: Repeated idempotency_key. The original dispatch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicateDispatch'
        '202':
          description: Queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchIdResponse'
        '429':
          description: Over the per-IP budget (60 per minute) or the endpoint budget.
        default:
          description: An error as application/problem+json (api-contract.md Errors).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/integrations/whoop:
    get:
      tags:
      - WHOOP
      summary: '`GET /v1/integrations/whoop`. Only our own bookkeeping: no WHOOP values.'
      operationId: get_whoop_status
      responses:
        '200':
          description: Connection state. No WHOOP values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusBody'
        '404':
          description: WHOOP is off on this server.
        default:
          description: An error as application/problem+json (api-contract.md Errors).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - session: []
    delete:
      tags:
      - WHOOP
      summary: '`DELETE /v1/integrations/whoop`: revoke at WHOOP, then delete tokens and webhook rows. 204.'
      operationId: disconnect_whoop
      responses:
        '204':
          description: Revoked at WHOOP and tokens deleted.
        default:
          description: An error as application/problem+json (api-contract.md Errors).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - session: []
  /v1/integrations/whoop/callback:
    get:
      tags:
      - WHOOP
      summary: '`GET /v1/integrations/whoop/callback`. The state names the user, so no session cookie is needed.'
      operationId: whoop_callback
      parameters:
      - name: code
        in: query
        description: WHOOP authorization code.
        required: true
        schema:
          type: string
      - name: state
        in: query
        description: The 8-character state from connect.
        required: true
        schema:
          type: string
      responses:
        '302':
          description: Redirect to /integrations/whoop.
        default:
          description: An error as application/problem+json (api-contract.md Errors).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/integrations/whoop/connect:
    get:
      tags:
      - WHOOP
      summary: '`GET /v1/integrations/whoop/connect`: 302 to WHOOP''s authorize page with a fresh 8-character state.'
      operationId: connect_whoop
      responses:
        '302':
          description: Redirect to WHOOP authorization.
          headers:
            location:
              schema:
                type: string
              description: WHOOP authorize URL.
        default:
          description: An error as application/problem+json (api-contract.md Errors).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - session: []
  /v1/integrations/whoop/summary:
    get:
      tags:
      - WHOOP
      summary: '`GET /v1/integrations/whoop/summary?day=`: live fetch, nothing written except refreshed tokens.'
      operationId: get_whoop_summary
      parameters:
      - name: day
        in: query
        description: YYYY-MM-DD. Defaults to today in the user time zone.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Live from WHOOP, not stored. Any value may be null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Summary'
        default:
          description: An error as application/problem+json (api-contract.md Errors).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - session: []
  /v1/integrations/whoop/webhook:
    post:
      tags:
      - WHOOP
      summary: '`POST /v1/integrations/whoop/webhook`: verify, dedupe by trace id, store the row, answer 204.'
      operationId: whoop_webhook
      requestBody:
        description: WHOOP event. Verified against the signature header, never stored raw.
        content:
          application/json:
            schema:
              type: object
        required: true
      responses:
        '204':
          description: Accepted. Verified with WHOOP's signature header.
        default:
          description: An error as application/problem+json (api-contract.md Errors).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/me:
    get:
      tags:
      - Me
      operationId: get_me
      responses:
        '200':
          description: The account profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        default:
          description: An error as application/problem+json (api-contract.md Errors).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - session: []
      - device: []
    delete:
      tags:
      - Me
      summary: Deletes the account and, through cascades, every row that belongs to it.
      operationId: delete_me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteBody'
        required: true
      responses:
        '204':
          description: Account and all of its rows deleted.
        default:
          description: An error as application/problem+json (api-contract.md Errors).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - session: []
    patch:
      tags:
      - Me
      operationId: patch_me
      parameters:
      - name: If-Match
        in: header
        description: Current version. Required; a stale value gets 409.
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MePatch'
        required: true
      responses:
        '200':
          description: The updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        default:
          description: An error as application/problem+json (api-contract.md Errors).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - session: []
      - device: []
  /v1/metrics/daily:
    get:
      tags:
      - Metrics
      operationId: get_daily
      parameters:
      - name: from
        in: query
        description: YYYY-MM-DD in the user time zone.
        required: true
        schema:
          type: string
      - name: to
        in: query
        description: YYYY-MM-DD, inclusive. At most 3660 days after from.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Daily summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyResponse'
        default:
          description: An error as application/problem+json (api-contract.md Errors).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - session: []
      - device: []
  /v1/metrics/hr:
    get:
      tags:
      - Metrics
      operationId: get_hr
      parameters:
      - name: from
        in: query
        description: RFC 3339 start.
        required: true
        schema:
          type: string
      - name: to
        in: query
        description: RFC 3339 end, exclusive.
        required: true
        schema:
          type: string
      - name: res
        in: query
        description: raw (up to 6 h), 1m or 5m (up to 14 d), or 1h (up to 14 d).
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Points, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HrResponse'
        default:
          description: An error as application/problem+json (api-contract.md Errors).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - session: []
      - device: []
  /v1/metrics/live:
    get:
      tags:
      - Metrics
      summary: Latest raw sample across the user's bands, or nulls when there is none.
      operationId: get_live
      responses:
        '200':
          description: The latest raw sample, or nulls.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveResponse'
        default:
          description: An error as application/problem+json (api-contract.md Errors).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - session: []
      - device: []
  /v1/metrics/minutes:
    get:
      tags:
      - Metrics
      operationId: get_minutes
      parameters:
      - name: from
        in: query
        description: RFC 3339 start.
        required: true
        schema:
          type: string
      - name: to
        in: query
        description: RFC 3339 end, exclusive. At most 14 days.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Minute metrics. Estimates, not medical readings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MinutesResponse'
        default:
          description: An error as application/problem+json (api-contract.md Errors).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - session: []
      - device: []
  /v1/sync/batches:
    post:
      tags:
      - Sync
      operationId: post_sync_batch
      parameters:
      - name: Idempotency-Key
        in: header
        description: Same value as batch_id.
        required: true
        schema:
          type: string
          format: uuid
      - name: Content-Encoding
        in: header
        description: gzip, or absent.
        required: false
        schema:
          type:
          - string
          - 'null'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchBody'
        required: true
      responses:
        '200':
          description: Stored. A repeated batch_id answers with the stored counts and duplicate = true.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
        default:
          description: An error as application/problem+json (api-contract.md Errors).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - device: []
  /v1/sync/config:
    get:
      tags:
      - Sync
      summary: Rows with `version > since`, tombstones included, plus the profile (api-contract.md).
      operationId: get_sync_config
      parameters:
      - name: since
        in: query
        description: Return rows with version greater than this. Omit for all rows.
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Alarms (tombstones included), hooks, profile and the newest version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
        default:
          description: An error as application/problem+json (api-contract.md Errors).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - device: []
  /v1/sync/state:
    get:
      tags:
      - Sync
      operationId: get_sync_state
      responses:
        '200':
          description: The latest 50 batches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateResponse'
        default:
          description: An error as application/problem+json (api-contract.md Errors).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - session: []
      - device: []
components:
  schemas:
    AckBody:
      type: object
      required:
      - phone
      - band
      properties:
        band:
          type: string
        detail:
          type:
          - string
          - 'null'
        phone:
          type: string
      additionalProperties: false
    Alarm:
      type: object
      description: '`Alarm` in api-contract.md.'
      required:
      - id
      - kind
      - label
      - rhythm
      - channels
      - enabled
      - version
      - updated_at
      properties:
        channels:
          type: array
          items:
            $ref: '#/components/schemas/Channel'
        deleted_at:
          type:
          - string
          - 'null'
          format: date-time
        enabled:
          type: boolean
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/AlarmKind'
        label:
          type: string
        rhythm:
          $ref: '#/components/schemas/Rhythm'
        schedule:
          oneOf:
          - $ref: '#/components/schemas/Schedule'
          - type: 'null'
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    AlarmCreate:
      type: object
      required:
      - kind
      - label
      - rhythm
      - channels
      properties:
        channels:
          type: array
          items:
            $ref: '#/components/schemas/Channel'
        enabled:
          type: boolean
        id:
          type:
          - string
          - 'null'
          format: uuid
        kind:
          $ref: '#/components/schemas/AlarmKind'
        label:
          type: string
        rhythm:
          $ref: '#/components/schemas/Rhythm'
        schedule:
          oneOf:
          - $ref: '#/components/schemas/Schedule'
          - type: 'null'
      additionalProperties: false
    AlarmKind:
      type: string
      enum:
      - scheduled
      - webhook
      - relay
    AlarmList:
      type: object
      required:
      - alarms
      properties:
        alarms:
          type: array
          items:
            $ref: '#/components/schemas/Alarm'
    AlarmPatch:
      type: object
      properties:
        channels:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Channel'
        enabled:
          type:
          - boolean
          - 'null'
        kind:
          oneOf:
          - $ref: '#/components/schemas/AlarmKind'
          - type: 'null'
        label:
          type:
          - string
          - 'null'
        rhythm:
          oneOf:
          - $ref: '#/components/schemas/Rhythm'
          - type: 'null'
        schedule:
          oneOf:
          - $ref: '#/components/schemas/Schedule'
          - type: 'null'
      additionalProperties: false
    AuthMode:
      type: string
      enum:
      - hmac
      - secret_url
    Band:
      type: object
      required:
      - id
      - created_at
      properties:
        created_at:
          type: string
          format: date-time
        firmware:
          type:
          - string
          - 'null'
        id:
          type: string
          format: uuid
        last_seen_at:
          type:
          - string
          - 'null'
          format: date-time
        name:
          type:
          - string
          - 'null'
    BandIn:
      type: object
      required:
      - id
      - name
      properties:
        firmware:
          type:
          - string
          - 'null'
        id:
          type: string
          format: uuid
        name:
          type: string
    BatchBody:
      type: object
      required:
      - schema
      - batch_id
      - device_id
      - created_at
      properties:
        alarm_deliveries:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryIn'
        bands:
          type: array
          items:
            $ref: '#/components/schemas/BandIn'
        batch_id:
          type: string
          format: uuid
        created_at:
          type: string
        device_id:
          type: string
          format: uuid
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventIn'
        hr:
          oneOf:
          - $ref: '#/components/schemas/HrIn'
          - type: 'null'
        minute_metrics:
          type: array
          items:
            $ref: '#/components/schemas/MinuteIn'
        rr:
          oneOf:
          - $ref: '#/components/schemas/RrIn'
          - type: 'null'
        schema:
          type: integer
          format: int64
    BatchResponse:
      type: object
      required:
      - batch_id
      - duplicate
      - server_time
      - counts
      properties:
        batch_id:
          type: string
          format: uuid
        counts:
          $ref: '#/components/schemas/Counts'
        duplicate:
          type: boolean
        server_time:
          type: string
          format: date-time
    BatchSummary:
      type: object
      required:
      - id
      - device_id
      - received_at
      - counts
      - status
      properties:
        counts: {}
        device_id:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        received_at:
          type: string
          format: date-time
        status:
          type: string
    Channel:
      type: string
      enum:
      - phone
      - band
    ConfigResponse:
      type: object
      required:
      - alarms
      - webhook_endpoints
      - profile
      - max_version
      - server_time
      properties:
        alarms:
          type: array
          items:
            $ref: '#/components/schemas/Alarm'
        max_version:
          type: integer
          format: int64
        profile:
          $ref: '#/components/schemas/Me'
        server_time:
          type: string
          format: date-time
        webhook_endpoints:
          type: array
          items:
            $ref: '#/components/schemas/Hook'
    Counts:
      type: object
      required:
      - hr
      - rr
      - minute_metrics
      - events
      - alarm_deliveries
      properties:
        alarm_deliveries:
