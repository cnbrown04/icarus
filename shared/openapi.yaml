          type:
          - number
          - 'null'
          format: float
        day:
          type: string
          format: date
        hr_avg:
          type:
          - number
          - 'null'
          format: float
        hr_max:
          type:
          - integer
          - 'null'
          format: int32
        kcal_active:
          type:
          - number
          - 'null'
          format: float
        kcal_total:
          type:
          - number
          - 'null'
          format: float
        rhr:
          type:
          - integer
          - 'null'
          format: int32
        rmssd_night_ms:
          type:
          - number
          - 'null'
          format: float
        stress_avg:
          type:
          - number
          - 'null'
          format: float
        stress_high_minutes:
          type:
          - integer
          - 'null'
          format: int32
    DeleteBody:
      type: object
