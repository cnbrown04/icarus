          type:
          - string
          - 'null'
          format: date-time
        alarm_id:
          type:
          - string
          - 'null'
          format: uuid
        attempts:
          type: integer
          format: int32
        band_status:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        delivery_id:
          type:
          - string
          - 'null'
          format: uuid
        id:
          type: string
          format: uuid
        message:
          type:
          - string
          - 'null'
        phone_status:
          type:
          - string
          - 'null'
        rhythm:
          $ref: '#/components/schemas/Rhythm'
        status:
          $ref: '#/components/schemas/DispatchStatus'
    DispatchIdResponse:
      type: object
