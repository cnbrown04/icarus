      required:
      - id
      - slug
      - label
      - auth_mode
      - rate_limit_per_min
      - enabled
      - url
      - created_at
      - version
      properties:
        alarm_id:
          type:
          - string
          - 'null'
          format: uuid
        auth_mode:
          $ref: '#/components/schemas/AuthMode'
        created_at:
          type: string
          format: date-time
        enabled:
          type: boolean
        id:
          type: string
          format: uuid
        label:
          type: string
        last_triggered_at:
          type:
          - string
          - 'null'
          format: date-time
        rate_limit_per_min:
          type: integer
          format: int32
        slug:
          type: string
        url:
          type: string
        version:
          type: integer
          format: int64
    HookCreate:
      type: object
      required:
      - label
      - alarm_id
      - auth_mode
      properties:
        alarm_id:
          type: string
          format: uuid
        auth_mode:
          $ref: '#/components/schemas/AuthMode'
        label:
          type: string
        rate_limit_per_min:
          type:
          - integer
          - 'null'
          format: int32
      additionalProperties: false
    HookCreated:
      allOf:
      - $ref: '#/components/schemas/Hook'
