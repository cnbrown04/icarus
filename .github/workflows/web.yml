name: Web

on:
  pull_request:
    paths:
      - ".github/workflows/web.yml"
      - "web/**"
  push:
    branches: [main, 'claude/**']
    paths:
      - ".github/workflows/web.yml"
      - "web/**"
  workflow_dispatch:

permissions:
  contents: read

# One group per commit: each phase push keeps its own screenshot run.
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  web:
    name: Typecheck, lint, test, build and e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set short SHA
        run: echo "SHA7=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Lyra lock check
        run: pnpm lyra:check

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm e2e

      - name: Upload web screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-screenshots-${{ env.SHA7 }}
          path: web/test-results/screenshots
          retention-days: 14
          if-no-files-found: ignore

  # Push events only, after the tests pass. Pull requests keep the artifact and do not commit.
  commit-screenshots:
    name: Commit web screenshots
    needs: web
    if: github.event_name == 'push' && needs.web.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Credentials stay persisted: the commit step pushes screenshots/web back to the branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set short SHA
        run: echo "SHA7=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Download web screenshots
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-screenshots-${{ env.SHA7 }}
          path: web-shots

      - name: Prepare committed screenshots
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          PUBLISH="$RUNNER_TEMP/publish-web"
          rm -rf "$PUBLISH"
          mkdir -p "$PUBLISH"
          find web-shots -type f -name '*.png' -exec cp {} "$PUBLISH/" \;
          if ! ls "$PUBLISH"/*.png >/dev/null 2>&1; then
            echo "error: no web screenshots to commit" >&2
            exit 1
          fi
          {
            echo "# Web screenshots"
            echo
            echo "Commit: $GITHUB_SHA"
            echo "Run: $RUN_URL"
            echo
            for file in "$PUBLISH"/*.png; do
              name=$(basename "$file")
              echo "- [$name]($name)"
            done
          } > "$PUBLISH/index.md"
          ls "$PUBLISH"

      - name: Pick screenshot folder
        run: |
          SUBJECT=$(git log -1 --format=%s "$GITHUB_SHA")
          PHASE=$(echo "$SUBJECT" | sed -nE 's/^phase-([0-9]+).*/phase-\1/p')
          # Only phase commits (subject "phase-N: ...") get a committed set; artifacts always exist.
          if [ -n "$PHASE" ]; then
            echo "SHOT_DIR=screenshots/$PHASE" >> "$GITHUB_ENV"
            echo "Screenshot folder: screenshots/$PHASE"
          else
            echo "No phase prefix in the commit subject; screenshots stay in the artifact only"
          fi

      - name: Commit screenshots to repo
        if: env.SHOT_DIR != ''
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Run a copy: the checkout below may change ci/ before bash finishes reading the script.
          cp ci/commit_screenshots.sh "$RUNNER_TEMP/commit_screenshots.sh"
          bash "$RUNNER_TEMP/commit_screenshots.sh" "$BRANCH" "$RUNNER_TEMP/publish-web" \
            "$SHOT_DIR/web" "screenshots: web $SHA7 [skip ci]"
