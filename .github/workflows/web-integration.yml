name: Web integration

on:
  pull_request:
    paths:
      - ".github/workflows/web-integration.yml"
      - "web/**"
      - "server/**"
  push:
    branches: [main, 'claude/**']
    paths:
      - ".github/workflows/web-integration.yml"
      - "web/**"
      - "server/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Playwright against a real server
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: icarus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/icarus
      ICARUS_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build web
        working-directory: web
        run: pnpm build

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: server

      - name: Build server
        working-directory: server
        run: cargo build --bin icarus-server

      - name: Generate test credentials
        run: |
          set -euo pipefail
          password="$(openssl rand -base64 18)"
          key="$(openssl rand -base64 32)"
          echo "::add-mask::$password"
          echo "::add-mask::$key"
          echo "ICARUS_E2E_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "ICARUS_ENC_KEY=$key" >> "$GITHUB_ENV"

      - name: Create the test user
        working-directory: server
        env:
          ICARUS_PASSWORD: ${{ env.ICARUS_E2E_PASSWORD }}
        run: ./target/debug/icarus-server create-user e2e@example.com

      - name: Start the server
        working-directory: server
        env:
          ICARUS_WEB_DIR: ../web/dist
          ICARUS_INSECURE_COOKIES: "1"
          PUBLIC_BASE_URL: http://localhost:8080
        run: |
          set -euo pipefail
          nohup ./target/debug/icarus-server > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/readyz; then
              echo
              exit 0
            fi
            sleep 1
          done
          echo "error: the server did not become ready" >&2
          cat "$RUNNER_TEMP/server.log" >&2
          exit 1

      - name: Seed the server
        working-directory: web
        env:
          ICARUS_E2E_DIR: ${{ runner.temp }}/icarus-e2e
        run: node scripts/seed-integration.mjs

      - name: Install Playwright Chromium
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E against the server
        working-directory: web
        env:
          ICARUS_E2E_DIR: ${{ runner.temp }}/icarus-e2e
        run: pnpm e2e:real

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-integration-report
          path: |
            web/playwright-report
            web/test-results/integration
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-integration-server-log
          path: ${{ runner.temp }}/server.log
          retention-days: 14
          if-no-files-found: ignore
